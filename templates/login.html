<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Secure Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, #1a1a2e, #16213e),
                linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            background-blend-mode: overlay;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            overflow: hidden;
        }

        /* Ambient background blobs */
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            filter: blur(80px);
            border-radius: 50%;
            z-index: 0;
            animation: move 20s infinite alternate;
        }

        .blob-1 {
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes move {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(100px, 100px) scale(1.2);
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 56px 48px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo {
            text-align: center;
            font-size: 56px;
            margin-bottom: 16px;
            display: block;
            filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.5));
        }

        h1 {
            color: #fff;
            font-size: 32px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.45);
            font-size: 15px;
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .pw-wrap {
            position: relative;
        }

        .toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .toggle:hover {
            opacity: 1;
        }

        .extras {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .rem-me {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
        }

        .rem-me input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .forgot {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot:hover {
            color: #8ba1ff;
        }

        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        #msg {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            padding: 14px;
            border-radius: 12px;
            display: none;
            animation: shake 0.4s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .success {
            display: block !important;
            background: rgba(6, 214, 160, 0.15);
            color: #06d6a0;
            border: 1px solid rgba(6, 214, 160, 0.2);
        }

        .error {
            display: block !important;
            background: rgba(255, 77, 109, 0.15);
            color: #ff4d6d;
            border: 1px solid rgba(255, 77, 109, 0.2);
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 15px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            margin-left: 6px;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s infinite linear;
            display: inline-block;
            vertical-align: middle;
            margin-right: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="card">
        <span class="logo">🚀</span>
        <h1>Welcome Back</h1>
        <p class="subtitle">Securely log in to manage your professional dashboard and insights.</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@company.com" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="pw-wrap">
                    <input type="password" id="password" placeholder="••••••••" required
                        autocomplete="current-password">
                    <button type="button" class="toggle" onclick="togglePw()">👁️</button>
                </div>
            </div>

            <div class="extras">
                <label class="rem-me"><input type="checkbox"> Remember me</label>
                <a href="#" class="forgot">Forgot password?</a>
            </div>

            <button type="submit" class="btn" id="loginBtn">Sign In</button>
        </form>

        <div id="msg"></div>

        <p class="footer">Don't have an account?<a href="/signup">Create One</a></p>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const msg = document.getElementById('msg');
        const btn = document.getElementById('loginBtn');

        function togglePw() {
            const input = document.getElementById('password');
            const btn = event.currentTarget;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span>Authenticating...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                    msg.textContent = 'Login successful! Redirecting to dashboard...';
                    msg.className = 'success';

                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1200);
                } else {
                    msg.textContent = data.detail || 'Invalid email or password';
                    msg.className = 'error';
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                }
            } catch (err) {
                msg.textContent = 'Network error. Please check your connection.';
                msg.className = 'error';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>

</html>
