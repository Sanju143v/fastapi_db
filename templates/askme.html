<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskMe AI | MyApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4318ff;
            --bg: #f4f7fe;
            --white: #ffffff;
            --text-dark: #1b2559;
            --text-gray: #a3aed0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--white);
            border-right: 1px solid #e9edf7;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 50px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .brand span:first-child {
            font-size: 30px;
        }

        .brand b {
            font-size: 24px;
            font-weight: 800;
        }

        .nav {
            list-style: none;
            flex: 1;
        }

        .nav-item {
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-gray);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-item:hover {
            color: var(--primary);
            background: var(--bg);
        }

        .nav-item.active {
            color: var(--primary);
            background: var(--bg);
        }

        /* Chat Area */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 80px;
            background: var(--white);
            border-bottom: 1px solid #e9edf7;
            display: flex;
            align-items: center;
            padding: 0 50px;
        }

        .header h2 {
            font-size: 20px;
            font-weight: 700;
        }

        #chat-container {
            flex: 1;
            padding: 40px 50px;
            overflow-y: auto;
            display: flex;
            flexDirection: column;
            gap: 25px;
        }

        .message {
            max-width: 80%;
            padding: 18px 25px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.6;
            animation: slideIn 0.3s ease-out;
        }

        .user-msg {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .ai-msg {
            align-self: flex-start;
            background: var(--white);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border-bottom-left-radius: 5px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-area {
            background: var(--white);
            padding: 30px 50px;
            border-top: 1px solid #e9edf7;
            display: flex;
            gap: 15px;
        }

        #user-input {
            flex: 1;
            border: none;
            background: var(--bg);
            padding: 15px 30px;
            border-radius: 30px;
            outline: none;
            font-size: 15px;
        }

        .send-btn {
            background: var(--primary);
            border: none;
            padding: 10px 30px;
            border-radius: 30px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .send-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* Typing Dot Animation */
        .typing {
            display: flex;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--text-gray);
            border-radius: 50%;
            animation: blink 1.4s infinite both;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            80%,
            100% {
                opacity: 0;
            }

            40% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <a href="/dashboard" class="brand">
                <span>📱</span>
                <b>MYAPP</b>
            </a>
            <ul class="nav">
                <li class="nav-item" onclick="location.href='/dashboard'"><i>🏠</i> Dashboard</li>
                <li class="nav-item active"><i>🤖</i> AskAI</li>
            </ul>
        </div>

        <div class="chat-main">
            <header class="header">
                <h2>🤖 AskMe AI</h2>
            </header>

            <div id="chat-container">
                <div class="message ai-msg">Hi there! I'm your human-friendly MyApp assistant. How can I help you today?
                    ✨</div>
            </div>

            <form class="input-area" id="chat-form">
                <input type="text" id="user-input" placeholder="Ask me anything..." autocomplete="off">
                <button type="submit" class="send-btn">Send 🚀</button>
            </form>
        </div>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');

        function appendMessage(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + (role === 'user' ? 'user-msg' : 'ai-msg');
            msgDiv.innerHTML = content;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            appendMessage('user', text);

            // Typing indicator
            const typingDiv = appendMessage('ai', '<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>');

            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        system_prompt: "You are a friendly, conversational human-like assistant for MyApp. Be helpful, concise, and professional yet warm."
                    })
                });

                const data = await res.json();
                typingDiv.remove();

                if (res.ok) {
                    appendMessage('ai', data.response);
                } else {
                    appendMessage('ai', "I hit a snag. Could you try asking that again?");
                }
            } catch (err) {
                typingDiv.remove();
                appendMessage('ai', "Oops! Network issues. Let's try once more.");
            }
        });
    </script>
</body>

</html>
